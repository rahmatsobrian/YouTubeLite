name: Android CI Build (Debug APK)

# Tidak memerlukan repo secret apapun - build debug APK ditandatangani otomatis
# dengan debug keystore bawaan Gradle/Android SDK.
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

env:
  GRADLE_VERSION: "8.9"
  # Aktifkan logging verbose Gradle/Android agar mudah debug jika gagal
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.logging.level=info"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle & wrapper distributions
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Repo ini sengaja TIDAK menyertakan gradle-wrapper.jar (binary) di git.
      # Gradle diinstal sementara di runner, lalu dipakai untuk MEMBANGKITKAN
      # sendiri gradlew, gradlew.bat, dan gradle-wrapper.jar sesuai versi
      # yang tertulis di gradle/wrapper/gradle-wrapper.properties.
      - name: Install temporary Gradle & generate gradle-wrapper.jar
        run: |
          echo "== Mengunduh Gradle ${GRADLE_VERSION} untuk membangkitkan wrapper =="
          wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH="/tmp/gradle-${GRADLE_VERSION}/bin:$PATH"
          gradle --version
          echo "== Generating Gradle wrapper (gradlew, gradlew.bat, gradle-wrapper.jar) =="
          gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type bin --info
          chmod +x ./gradlew
          ls -la gradle/wrapper/

      - name: Verify generated wrapper
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar && echo "gradle-wrapper.jar OK" || (echo "gradle-wrapper.jar MISSING" && exit 1)
          ./gradlew --version

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Lint (non-blocking, for early bug detection)
        run: ./gradlew lintDebug --stacktrace --info
        continue-on-error: true

      - name: Build Debug APK (verbose logging enabled)
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --info --warning-mode all 2>&1 | tee build-console.log

      - name: Upload full console log (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-console-log
          path: build-console.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build logs (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/outputs/logs/**
            build/reports/**
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-lite-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
